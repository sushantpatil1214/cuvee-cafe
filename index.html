<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuvee Café Menu</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #faf8f6; /* soft cream background */
      color: #2e2e2e;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: #822626; /* elegant maroon */
      color: #fff;
      border-bottom: 3px solid #c5a46d;
    }
    header h1 {
      font-family: Georgia, serif;
      font-size: 32px;
      margin: 0;
      color: #f8e7d8;
      letter-spacing: 2px;
    }
    header p {
      font-size: 15px;
      color: #f0d9b5;
      margin-top: 6px;
      font-style: italic;
    }

    .menu {
      max-width: 800px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .section-header {
      background: #f9f4f1;
      padding: 15px 20px;
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: bold;
      color: #822626;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .section-header:hover {
      background: #f3ebe7;
    }

    .items {
      display: none; /* hidden until expanded */
      padding: 10px 20px 20px;
    }

    .item {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      align-items: flex-start;
      border-bottom: 1px dashed #eee;
      padding-bottom: 10px;
    }
    .item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .item img {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #ddd;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: bold;
      color: #333;
    }
    .price {
      color: #822626;
      margin-left: 10px;
    }
    .desc {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: #6e5643;
      border-top: 1px solid #ddd;
      margin-top: 30px;
    }

    /* Mobile tweaks */
    @media (max-width: 500px) {
      header h1 {
        font-size: 26px;
      }
      .section-header {
        font-size: 16px;
        padding: 12px 15px;
      }
      .item img {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>CUVÉE CAFÉ</h1>
    <p>Luxury in Every Sip & Bite</p>
  </header>

  <div class="menu" id="menu"></div>

  <footer>
    © 2025 Cuvee Café | A Crafted Experience
  </footer>

  <script>
    // Load menu.json dynamically
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        const menuContainer = document.getElementById('menu');

        for (const section in data) {
          const sectionDiv = document.createElement('div');
          sectionDiv.classList.add('section');

          // Section Header
          const headerDiv = document.createElement('div');
          headerDiv.classList.add('section-header');
          headerDiv.innerHTML = `<span>${section}</span><span>+</span>`;
          sectionDiv.appendChild(headerDiv);

          // Items
          const itemsDiv = document.createElement('div');
          itemsDiv.classList.add('items');

          data[section].forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.classList.add('item');
            itemDiv.innerHTML = `
              <img src="${item.img}" alt="${item.name}">
              <div class="item-details">
                <div class="item-header">
                  <span>${item.name}</span>
                  <span class="price">${item.price}</span>
                </div>
                <p class="desc">${item.desc}</p>
              </div>
            `;
            itemsDiv.appendChild(itemDiv);
          });

          sectionDiv.appendChild(itemsDiv);
          menuContainer.appendChild(sectionDiv);

          // Toggle expand/collapse
          headerDiv.addEventListener('click', () => {
            const visible = itemsDiv.style.display === 'block';
            itemsDiv.style.display = visible ? 'none' : 'block';
            headerDiv.querySelector('span:last-child').textContent = visible ? '+' : '−';
          });
        }
      })
      .catch(error => console.error('Error loading menu.json:', error));
  </script>
</body>
</html>
