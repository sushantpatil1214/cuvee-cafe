<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuvee Coffee Menu</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* HEADER */
    header {
      background: #822626;
      color: white;
      text-align: center;
      padding: 40px 20px 30px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }
    header p {
      margin: 6px 0;
      font-size: 14px;
      color: #f6dcdc;
    }

    /* MENU */
    .menu {
      max-width: 800px;
      margin: 25px auto;
      padding: 0 15px;
      display: grid;
      gap: 20px;
    }

    /* SECTION */
    .section {
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .section-header {
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: bold;
      color: #822626;
      padding: 14px 18px;
      cursor: pointer;
      background: #f9f4f1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-header:hover {
      background: #f3ebe7;
    }
    .toggle-icon {
      font-weight: bold;
      font-size: 18px;
      color: #a13333;
    }

    .items {
      display: none; /* collapsed by default */
      padding: 15px;
      background: #fafafa;
      display: none;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    /* ITEM CARD STYLE (like your screenshot) */
    .item-card {
      display: flex;
      background: #fbe8e8;
      border-radius: 50px;
      overflow: hidden;
      height: 100px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .item-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 20px;
    }
    .item-left h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      color: #333;
    }
    .item-left .price {
      margin-top: 6px;
      font-size: 15px;
      font-weight: bold;
      color: #a13333;
    }

    .item-right {
      width: 120px;
      height: 100%;
      flex-shrink: 0;
    }
    .item-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Responsive */
    @media (max-width: 500px) {
      header h1 {
        font-size: 24px;
      }
      .section-header {
        font-size: 16px;
        padding: 12px 15px;
      }
      .item-card {
        height: 90px;
      }
      .item-right {
        width: 100px;
      }
      .item-left h3 {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Cuvee Coffee</h1>
    <p>97 Sonigara Bizz, Ravet, Pune</p>
    <p>wifi: Cuvee | password: iamatcuvee</p>
  </header>

  <div class="menu" id="menu"></div>

  <script>
    // Load items dynamically from menu.json
    fetch("menu.json")
      .then(response => response.json())
      .then(data => {
        const menuContainer = document.getElementById("menu");

        // Loop through each category
        for (const section in data) {
          const sectionDiv = document.createElement("div");
          sectionDiv.classList.add("section");

          // Header with toggle
          const headerDiv = document.createElement("div");
          headerDiv.classList.add("section-header");
          headerDiv.innerHTML = `<span>${section}</span><span class="toggle-icon">+</span>`;
          sectionDiv.appendChild(headerDiv);

          // Items container (collapsed by default)
          const itemsDiv = document.createElement("div");
          itemsDiv.classList.add("items");

          data[section].forEach(item => {
            const card = document.createElement("div");
            card.classList.add("item-card");

            card.innerHTML = `
              <div class="item-left">
                <h3>${item.name}</h3>
                <div class="price">${item.price}</div>
              </div>
              <div class="item-right">
                <img src="${item.img}" alt="${item.name}">
              </div>
            `;
            itemsDiv.appendChild(card);
          });

          sectionDiv.appendChild(itemsDiv);
          menuContainer.appendChild(sectionDiv);

          // Toggle expand/collapse
          headerDiv.addEventListener("click", () => {
            const isVisible = itemsDiv.style.display === "grid";
            itemsDiv.style.display = isVisible ? "none" : "grid";
            headerDiv.querySelector(".toggle-icon").textContent = isVisible ? "+" : "−";
          });
        }
      })
      .catch(err => console.error("Error loading menu.json:", err));
  </script>
</body>
</html>
